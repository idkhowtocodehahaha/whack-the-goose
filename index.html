<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whack the Goose</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;background:#c9e7f8}#game{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:crosshair;background:linear-gradient(#cce9fb 0 59%,#9fd3ef 59% 100%)}.water{position:absolute;left:0;right:0;bottom:0;height:41%;background:repeating-linear-gradient(176deg,transparent 0 35px,#fff5 36px 39px,transparent 40px 73px)}.reeds{position:absolute;bottom:14%;font-size:clamp(35px,6vw,70px);opacity:.55}.left{left:2%}.right{right:2%}#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#ffffffdf;color:#263b4a;padding:9px 15px;border-radius:999px;font-weight:850;font-size:clamp(12px,2vw,16px);box-shadow:0 3px 10px #315a7620;white-space:nowrap;z-index:5}#scene{position:relative;width:min(82vw,620px);height:min(78vh,620px);z-index:2;overflow:visible;cursor:pointer;touch-action:manipulation;outline:none}#goose{transform-box:fill-box;transform-origin:50% 75%}#game.hit #goose{animation:gooseBonk .58s ease-out}#game.hit #scene{animation:sceneWobble .58s ease-out}@keyframes gooseBonk{0%{transform:translateY(0) scale(1)}18%{transform:translateY(17px) scale(1.08,.78) rotate(-4deg)}38%{transform:translateY(-10px) scale(.96,1.06) rotate(4deg)}60%{transform:translateY(3px) scale(1.02,.98) rotate(-2deg)}100%{transform:translateY(0) scale(1) rotate(0)}}@keyframes sceneWobble{0%,100%{rotate:0deg}25%{rotate:-1.4deg}50%{rotate:1.4deg}75%{rotate:-.6deg}}
#hammer{position:absolute;z-index:4;width:clamp(88px,14vw,140px);left:50%;top:9%;transform:translate(-50%,-50%) rotate(-32deg);transform-origin:72% 78%;pointer-events:none;filter:drop-shadow(2px 5px 2px #2344)}#game.hit #hammer{animation:hammerSwing .38s ease-in forwards}@keyframes hammerSwing{0%{transform:translate(-50%,-50%) rotate(-32deg)}42%{transform:translate(-42%,55%) rotate(48deg)}65%{transform:translate(-48%,48%) rotate(35deg)}100%{transform:translate(-50%,-50%) rotate(-32deg)}}
#bonk{position:absolute;z-index:6;pointer-events:none;font-weight:1000;font-size:clamp(25px,5vw,54px);color:#ff693d;-webkit-text-stroke:1px white;text-shadow:3px 4px 0 #2d4359;opacity:0;left:50%;top:32%;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}#game.hit #bonk{animation:pop .65s ease-out forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.2) rotate(8deg)}75%{opacity:1;transform:translate(-50%,-90%) scale(1) rotate(-5deg)}100%{opacity:0;transform:translate(-50%,-120%) scale(.8)}}#count,#message{position:absolute;bottom:14px;background:#ffffffdf;border-radius:14px;padding:8px 12px;color:#243746;font-weight:800;z-index:5;box-shadow:0 2px 8px #315a7620}#count{right:14px}#message{left:14px;font-size:14px}#game.hit #beak{animation:beak  .22s ease-in-out 2;transform-box:fill-box;transform-origin:left center}@keyframes beak{50%{rotate:-10deg;translate:0 -3px}}.spark{opacity:0;transform-box:fill-box;transform-origin:center}#game.hit .spark{animation:sparkle .5s ease-out}@keyframes sparkle{0%{opacity:0;scale:.3;rotate:-15deg}30%{opacity:1;scale:1.2;rotate:10deg}100%{opacity:0;scale:.6;rotate:25deg}}@media(max-width:600px){#scene{width:98vw;height:70vh}#hammer{top:12%}#hint{max-width:94vw;white-space:normal;text-align:center}#message{max-width:60vw}}
</style></head>
<body><main id="game" aria-label="Whack the Canada Goose game"><div class="water"></div><div class="reeds left">🌾</div><div class="reeds right">🌾</div><div id="hint">🪿 WHACK THE GOOSE — CLICK IT!</div>
<!-- A clearly shaped mallet, not a box-shaped impact overlay -->
<svg id="hammer" viewBox="0 0 180 150" aria-hidden="true"><g stroke="#49301e" stroke-width="5" stroke-linejoin="round"><path d="M93 72L151 119Q158 125 164 118L169 111Q173 105 166 100L111 52Z" fill="#a86632"/><path d="M18 24Q18 13 30 13H101Q114 13 114 26V69Q114 82 101 82H30Q18 82 18 69Z" fill="#d79a55"/><path d="M20 28H112M20 66H112" stroke="#79502d" stroke-width="8"/><path d="M43 17V78M65 16V79M87 16V79" stroke="#edbd7d" stroke-width="3"/></g></svg>
<div id="bonk" aria-hidden="true">BONK!</div>
<svg id="scene" viewBox="0 0 500 500" role="button" tabindex="0" aria-label="Click the Canada goose to bonk it"><defs>
<linearGradient id="feathers" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#c7c5bd"/><stop offset=".6" stop-color="#92938f"/><stop offset="1" stop-color="#666a6b"/></linearGradient><linearGradient id="wing" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#66615d"/><stop offset="1" stop-color="#343638"/></linearGradient><linearGradient id="neck" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34383b"/><stop offset=".5" stop-color="#171b1e"/><stop offset="1" stop-color="#292d30"/></linearGradient>
</defs><ellipse cx="252" cy="430" rx="132" ry="19" fill="#4b9fc8" opacity=".3"/><g id="goose">
<!-- tail and body --> <path d="M329 333Q373 337 398 363Q363 366 329 354Z" fill="#292b2c" stroke="#202326" stroke-width="4" stroke-linejoin="round"/><path d="M160 330Q166 286 213 270Q266 251 316 291Q351 319 334 365Q319 407 266 416Q210 419 177 385Q158 363 160 330Z" fill="url(#feathers)" stroke="#424648" stroke-width="5" stroke-linejoin="round"/>
<!-- neat scalloped feather details --> <g fill="none" stroke="#e0ded5" stroke-width="3.5" stroke-linecap="round" opacity=".75"><path d="M187 315q17 11 33 5M179 337q24 13 44 6M185 360q26 12 46 4M207 382q26 11 48 3M244 292q23 8 39 25M268 315q18 12 28 28M270 346q18 10 27 22"/></g>
<!-- far wing --> <path d="M281 292Q321 249 347 188Q361 153 380 142Q393 139 392 156Q389 203 357 252Q335 284 309 313Z" fill="url(#wing)" stroke="#292c2e" stroke-width="5" stroke-linejoin="round"/><g fill="none" stroke="#898079" stroke-width="6" stroke-linecap="round"><path d="M300 292Q344 235 375 157M312 296Q352 246 384 177M325 298Q361 256 387 198"/></g>
<!-- near wing --> <path d="M197 301Q151 276 119 235Q95 204 100 184Q106 168 122 184Q159 223 216 249Q244 264 250 290Q228 312 197 301Z" fill="url(#wing)" stroke="#292c2e" stroke-width="5" stroke-linejoin="round"/><g fill="none" stroke="#aaa096" stroke-width="7" stroke-linecap="round"><path d="M112 190Q150 241 207 278M128 190Q166 235 218 270M144 207Q178 246 226 280M160 226Q191 257 231 287"/></g>
<!-- long black Canada-goose neck, continuous into head --> <path d="M230 295Q213 266 208 235Q198 194 216 157Q229 130 255 117Q272 107 295 115L302 131Q276 135 260 155Q242 179 249 210Q255 239 276 266L279 294Z" fill="url(#neck)" stroke="#171a1c" stroke-width="5" stroke-linejoin="round"/>
<!-- distinctive white cheek patch --> <path d="M268 122Q285 117 299 128Q293 141 278 147Q265 146 258 137Q259 129 268 122Z" fill="#fffaf0" stroke="#e3e0d7" stroke-width="2"/>
<!-- rounded cute head --> <path d="M248 119Q249 94 271 88Q293 83 309 101L326 111Q333 115 326 120L304 125Q287 136 268 130Z" fill="#202427" stroke="#171a1c" stroke-width="4.5" stroke-linejoin="round"/><ellipse cx="285" cy="103" rx="6.5" ry="7" fill="#fff"/><circle cx="287" cy="103" r="3.5" fill="#151515"/><circle cx="288" cy="101.5" r="1.2" fill="#fff"/>
<!-- beak --> <g id="beak"><path d="M322 111L346 115Q351 117 345 120L326 124L316 120Z" fill="#292d30" stroke="#171a1c" stroke-width="3.5" stroke-linejoin="round"/><path d="M324 121L338 120" stroke="#6d7273" stroke-width="1.5" stroke-linecap="round"/></g>
<!-- small legs and webbed feet --> <g fill="#292d30" stroke="#171a1c" stroke-width="3.5" stroke-linejoin="round"><path d="M213 400L209 427L195 439L222 442L214 432L222 404Z"/><path d="M291 401L298 428L287 439L315 442L306 429L304 402Z"/><path d="M195 439L181 449Q179 452 185 452H226Q230 451 225 447L222 442Z"/><path d="M287 439L275 449Q273 452 279 452H321Q326 451 321 447L315 442Z"/></g>
<!-- tiny wing highlights + impact sparkles --> <path d="M177 274q17 13 32 18M191 285q13 8 25 10" fill="none" stroke="#b9b0a5" stroke-width="3" stroke-linecap="round"/><g class="spark" fill="#ffd34d" stroke="#fff8d5" stroke-width="2"><path d="M365 224l6 13 13 2-10 9 2 13-11-7-12 7 3-13-10-9 14-2Z"/><path d="M128 292l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1Z"/></g>
</g></svg>
<div id="count">Bonks: <span id="score">0</span></div><div id="message">The goose is judging you.</div></main>
<script>
const game=document.getElementById('game'),scene=document.getElementById('scene'),score=document.getElementById('score'),message=document.getElementById('message');let hits=0,resetTimer;const lines=['HONK!','That was personal.','The goose remembers.','Canada is disappointed.','BONK!','Absolutely un-goosely.','You have made an enemy.'];
function whack(e){if(e)e.preventDefault();hits++;score.textContent=hits;game.classList.remove('hit');void game.offsetWidth;game.classList.add('hit');message.textContent=lines[Math.floor(Math.random()*lines.length)];clearTimeout(resetTimer);resetTimer=setTimeout(()=>game.classList.remove('hit'),720)}
scene.addEventListener('click',whack);scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){whack(e)}});
</script></body></html>
